# Server Configuration
server.port=8080

# Database Configuration (supports env variables DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/secure_campus_helpdesk?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Admin Bootstrap Credentials (Fallback defaults for first run)
app.admin.email=${ADMIN_EMAIL:admin@campus.edu}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:System Administrator}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.campus.helpdesk=INFO
